<!doctype html>
<html><head>
<meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
@keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
@keyframes train-bounce { 0%,100% { transform: rotate(-8deg) } 50% { transform: rotate(8deg) } }
@keyframes run { 0%,100% { transform: translateX(0) scaleX(1) } 49% { transform: translateX(120px) scaleX(1) } 50% { transform: translateX(120px) scaleX(-1) } 99% { transform: translateX(0) scaleX(-1) } 100% { transform: translateX(0) scaleX(1) } }
@keyframes flop { 0%,100% { transform: rotate(0) } 100% { transform: rotate(-90deg) translateY(10px) } }
#capibara { font-size: 56px; display: inline-block; }
#capibara.idle { animation: idle 2s ease-in-out infinite; }
#capibara.training { animation: train-bounce .3s ease-in-out infinite; }
#capibara.acting { animation: run 1.2s linear infinite; }
#capibara.done { animation: flop 1s ease-in forwards; }
#capibara.error { filter: grayscale(1); transform: rotate(180deg); }
</style>
</head>
<body class="bg-neutral-950 text-neutral-200 p-6 font-sans">
<div class="flex gap-8">
  <div class="w-80 space-y-3">
    <input id="tickers" value="SPY, QQQ, GLD, SHY" class="w-full bg-neutral-900 rounded p-2 text-sm" placeholder="Tickers (last = cash)">
    <div class="flex gap-2">
      <input id="randN" type="number" value="5" min="1" max="20" class="w-16 bg-neutral-900 rounded p-2 text-sm" title="How many random stocks">
      <button id="random" type="button" class="flex-1 bg-neutral-700 hover:bg-neutral-600 rounded p-2 text-sm">Random S&amp;P 500 + cash</button>
    </div>
    <div class="flex gap-2">
      <input id="start" type="date" value="2024-01-01" class="w-1/2 bg-neutral-900 rounded p-2 text-sm">
      <input id="end" type="date" class="w-1/2 bg-neutral-900 rounded p-2 text-sm">
    </div>
    <select id="algo" class="w-full bg-neutral-900 rounded p-2 text-sm"><option>PPO</option><option>A2C</option></select>
    <label class="text-xs text-neutral-400">Timesteps: <span id="tsLabel">5000</span>
      <input id="timesteps" type="range" min="1000" max="50000" step="1000" value="5000" class="w-full accent-blue-500"></label>
    <label class="text-xs text-neutral-400">Lookback window: <span id="winLabel">10</span>
      <input id="window" type="range" min="5" max="60" value="10" class="w-full accent-blue-500"></label>
    <label class="text-xs text-neutral-400">Initial balance ($)
      <input id="balance" type="number" value="10000" class="w-full bg-neutral-900 rounded p-2 text-sm"></label>
    <label class="text-xs text-neutral-400">Fee: <span id="feeLabel">0.0010</span>
      <input id="fee" type="range" min="0" max="0.02" step="0.0005" value="0.001" class="w-full accent-blue-500"></label>
    <label class="text-xs text-neutral-400">Episode length: <span id="epLabel">250</span>
      <input id="ep" type="range" min="50" max="1000" value="250" class="w-full accent-blue-500"></label>
    <button id="go" class="w-full bg-blue-600 hover:bg-blue-500 rounded p-2 font-semibold">Train &amp; watch</button>
    <div id="status" class="text-sm text-neutral-400"></div>
    <div class="bg-neutral-900 rounded p-4 text-center mt-4">
      <div id="capibara" class="idle">
        <svg viewBox="0 0 220 130" width="132" height="78">
          <rect x="84" y="96" width="16" height="28" rx="7" fill="#6e4a32"/>
          <rect x="106" y="98" width="16" height="26" rx="7" fill="#6e4a32"/>
          <rect x="150" y="98" width="16" height="26" rx="7" fill="#6e4a32"/>
          <rect x="172" y="96" width="16" height="28" rx="7" fill="#6e4a32"/>
          <ellipse cx="130" cy="74" rx="58" ry="33" fill="#9c7350"/>
          <path d="M16 40 L74 36 C 84 37 88 44 88 52 C 88 68 84 82 70 88 L 36 90 C 24 90 16 82 16 68 Z" fill="#9c7350"/>
          <ellipse cx="70" cy="32" rx="6" ry="9" fill="#6e4a32"/>
          <ellipse cx="130" cy="88" rx="44" ry="16" fill="#a97c58" opacity="0.45"/>
          <rect x="31" y="43" width="21" height="16" rx="7" fill="#15130f"/>
          <rect x="57" y="42" width="21" height="17" rx="7" fill="#15130f"/>
          <rect x="51" y="49" width="8" height="5" rx="2" fill="#15130f"/>
          <rect x="76" y="46" width="13" height="4" rx="2" fill="#15130f"/>
          <rect x="35" y="46.5" width="7" height="3.5" rx="1.75" fill="#5a6470"/>
          <rect x="61" y="45.5" width="7" height="3.5" rx="1.75" fill="#5a6470"/>
          <ellipse cx="19" cy="56" rx="2.5" ry="3.5" fill="#3d2a1b"/>
          <path d="M20 74 q8 5 16 2" stroke="#5d3f2b" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div id="burbuja" class="text-xs text-amber-400 mt-2 min-h-[32px]">The capybara awaits orders...</div>
    </div>
  </div>
  <div class="flex-1 space-y-4">
    <div id="chartWrap" class="bg-neutral-900 rounded p-4 h-96"><div id="chart" class="w-full h-full"></div></div>
    <div id="weights" class="flex gap-2"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let lastN = 0;
const sliders = [["timesteps","tsLabel"],["window","winLabel"],["ep","epLabel"]];
sliders.forEach(([s,l]) => $(s).oninput = () => $(l).textContent = $(s).value);
$("fee").oninput = () => $("feeLabel").textContent = (+$("fee").value).toFixed(4);
$("end").value = new Date().toISOString().slice(0,10);
const SP500 = ("A AAPL ABBV ABNB ABT ACGL ACN ADBE ADI ADSK AEE AEP AES AFL AIG AIZ ALB ALGN ALLE ALL AMAT AMCR AMD AME AMGN AMP AMT ANET ANSS AON AOS APA APD APH APO APP ARE ARM ATI AVB AVGO AVY AWK AXP AXON AZO AYI " +
"BA BAC BALL BAX BBWI BBY BDX BEN BF-B BG BK BKNG BKR BLDR BLK BMY BR BRO BRK-B BSX BWA BWXT BXP " +
"C CAH CAG CB CBOE CBRE CC CCL CDNS CDW CE CEG CF CFG CHD CHRW CHTR CI CINF CL CMCSA CMA CMG CMI CNC CNP COF COIN COP COR COO COST CPB CPRT CRL CRM CSGP CSCO CSX CTAS CTRA CTVA CVX CW CZR " +
"DAL DASH DAVA DD DDOG DE DELL DHI DG DGX DIS DKS DLTR DLR DOV DOW DRI DTE DUK DPZ DVN DXC DXCM " +
"EA EBAY ECL ED EFX EIX EL ELV EMN EMR EOG EPAM EPD EQIX EQR ERIE ES ESS ET ETN ETR ETSY EVRG EW EXC EXP EXPD EXR " +
"F FANG FAST FCNCA FDX FE FFIV FICO FI FITB FIVN FLS FLT FMC FN FOX FOXA FRT FTI FTNT FSLR FTV " +
"GD GE GEHC GEN GEV GDDY GILD GIS GL GLW GM GNRC GOOG GOOGL GPC GRMN GT GWW GS " +
"HAL HAS HBAN HCA HD HES HEI HIG HII HLT HOG HOLX HON HPE HPQ HRL HSIC HSY HUBB HUM HWM " +
"IBM IDXX IEX IFF ILMN INCY INTC INTU IP IPG IPGP IR IRM ISRG IT ITT ITW " +
"J JBHT JCI JKHY JNJ JPM " +
"K KDP KEY KEYS KHC KIM KLAC KMB KMI KMX KO KR KVUE " +
"L LDOS LECO LFG LH LHX LII LIN LKQ LNTH LEN LNC LNT LLY LMT LOW LRCX LUV LYB LUMN LYV LW " +
"MA MAA MAR MAS MAT MCD MCHP MCK MCO MDLZ MDT MET MHK MKC MLM MMC MNST MO MOH MOS MPC MPWR MRK MRNA MRTX MSCI MSFT MSI MTD MTB MTCH MU " +
"NDAQ NDSN NEE NE NEM NFLX NKE NI NJR NOC NOV NOW NRG NSC NTAP NTRS NUE NVDA NVR NWSA NWS NXPI " +
"O OC ODFL OI OKE OLN OMC ON ORCL ORLY OTIS OXY OZK " +
"PAYX PAYC PB PEAK PEG PENN PEP PFE PFG PG PGR PH PHIN PHM PKG PLD PL PM PNC PNR PNW POR PPG PPL PRU PSA PSX PTC PWR PYPL " +
"QCOM QRVO " +
"RCL REG REGN RE RF RHI RJF RL RMD ROK ROKU ROL ROP ROST RPM RSG RTX " +
"SBAC SBUX SCHW SEE SEDG SHW SJM SLB SLG SNA SNPS SO SPG SPGI SPOT STE STLD STT STZ SW SWK SWKS SYF SYK SYY SMCI " +
"T TAP TDG TDY TECH TEL TER TFC TGNA TGT THC TJX TKR TMO TMUS TROW TRMB TSCO TSLA TRI TRU TRV TT TTWO TTD TXN TXT TYL " +
"UAL UBER UDR UHS UFPI ULTA UMBF UNH UNM UNP UPS URI USB " +
"V VFC VLO VMC VRSK VRSN VST VTR VTRS VRT VRTX VZ " +
"WAB WAT WBD WCC WDC WDAY WEC WELL WFC WH WM WMB WMT WPC WRB WHR WST WY " +
"XEL XOM XRAY XYL " +
"YUM YUMC " +
"ZBH ZBRA ZION ZTS").split(" ");
$("random").onclick = () => {
  const n = Math.min(20, Math.max(1, +$("randN").value || 5));
  $("tickers").value = [...SP500].sort(() => Math.random() - .5).slice(0, n).join(", ") + ", CASH";
};

/* --- Streamlit component protocol (no build step) --- */
function sendMessageToStreamlitClient(type, data) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data), "*");
}
function init() { sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1}); }
function setFrameHeight(h) { sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: h}); }
function sendValue(v) { sendMessageToStreamlitClient("streamlit:setComponentValue", {value: v}); }
window.addEventListener("message", (event) => {
  if (event.data.type === "streamlit:render") {
    const a = typeof event.data.args === "string" ? JSON.parse(event.data.args) : event.data.args;
    render(a.state ?? a[0]);
    setFrameHeight(720);
  }
});

function render(s) {
  $("status").textContent = {idle:"Idle.", fetching:"Fetching data...", training:"Training... step "
    + (s.timesteps||0) + "/" + (s.total||"?") + " (ep reward " + (s.ep_reward||0) + ")",
    acting:"Agent acting...", done:"Done.", error:"Error: " + (s.message||"")}[s.phase] || s.phase;
  const capi = $("capibara"), burbuja = $("burbuja");
  capi.className = s.phase;
  burbuja.textContent = {
    idle: "The capybara awaits orders... 🌿",
    fetching: "Fetching market data... 📊",
    training: ["Training! Step " + (s.timesteps||0) + " of " + (s.total||"?") + " 💪",
               "Reading charts, chewing grass... 🌾",
               "This market stresses me out... but I persist. 😤",
               "Current reward: " + (s.ep_reward||0) + "! 🥕"][Math.floor(Date.now()/2000) % 4],
    acting: ["Buying before it's too late! 📈",
             "Selling everything, I'm scared... 😰",
             "Hmm... this stock smells weird. 🤔",
             "All cash — zen capybara mode. 🧘",
             "Diversify, my friend, diversify! 🎯"][Math.floor(Date.now()/1500) % 5],
    done: "Trades closed! The capybara takes a nap. 😴",
    error: "Oh no! Something broke: " + (s.message||"") + " 💔"
  }[s.phase] || "...";
  const c = s.curve || [];
  if (c.length > 1 && c.length !== lastN) {
    lastN = c.length;
    Plotly.react("chart", [
      {x: c.map(p => p.date), y: c.map(p => p.rl), name: "RL Agent", mode: "lines", line: {color: "#3b82f6"}},
      {x: c.map(p => p.date), y: c.map(p => p.bh), name: "Buy & Hold", mode: "lines", line: {color: "#737373"}}
    ], {
      paper_bgcolor: "#171717", plot_bgcolor: "#171717", font: {color: "#a3a3a3"},
      margin: {l: 60, r: 20, t: 10, b: 40}, height: 350, showlegend: true,
      legend: {orientation: "h", y: 1.1},
      xaxis: {gridcolor: "#262626"}, yaxis: {gridcolor: "#262626", tickprefix: "$"}
    }, {displayModeBar: false, responsive: true});
  }
  if (s.weights && s.weights.length) {
    const w = s.weights[s.weights.length - 1];
    const colors = ["#3b82f6","#10b981","#f59e0b","#ef4444","#8b5cf6","#14b8a6","#f472b6"];
    $("weights").innerHTML = w.map((v, i) =>
      `<div class="flex-1"><div class="text-xs text-neutral-400 mb-1">${(s.tickers[i]||"?")}: ${(v*100).toFixed(0)}%</div>
       <div class="bg-neutral-800 rounded-full h-3"><div class="rounded-full h-3" style="width:${v*100}%;background:${colors[i%7]}"></div></div></div>`).join("");
  }
}

$("go").onclick = () => {
  sendValue({event: "train", nonce: Date.now(), params: {
    tickers: $("tickers").value.split(",").map(t => t.trim().toUpperCase()).filter(Boolean),
    start: $("start").value, end: $("end").value, algo: $("algo").value,
    timesteps: +$("timesteps").value, window: +$("window").value,
    balance: +$("balance").value, fee: +$("fee").value, episode_length: +$("ep").value}});
};
init();
</script>
</body></html>
